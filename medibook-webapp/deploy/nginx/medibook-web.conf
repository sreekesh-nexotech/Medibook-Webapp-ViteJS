# Reference nginx config for the Medibook web app (docs/DEPLOYMENT.md, DEP-01).
#
# Serves the built app (dist/) at the domain root and proxies the backend on the
# same origin, so the browser never needs CORS (DEP-02) and the build can use
# VITE_API_BASE_URL=same-origin and VITE_WS_BASE_URL=same-origin.
#
# Replace: the server name, the certificate paths, the upstream addresses (the
# backend's REST and ASGI servers, or its own nginx) and the storage origin in
# medibook-security-headers.conf. Written for nginx 1.25.1 or later (`http2 on`),
# like the backend's own config.

upstream medibook_api {
    server 127.0.0.1:8000;          # Django (REST)
    keepalive 32;
}

upstream medibook_ws {
    server 127.0.0.1:8001;          # ASGI server (WebSockets)
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain http only redirects: the app refuses to start without https (DEP-05).
server {
    listen 80;
    listen [::]:80;
    server_name medibook.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name medibook.example.com;

    ssl_certificate     /etc/ssl/medibook/fullchain.pem;
    ssl_certificate_key /etc/ssl/medibook/privkey.pem;

    # The release being served: releases/<version>/ holds that build's dist/,
    # and `current` points at one of them (rollback = repoint, docs/DEPLOYMENT.md).
    root /srv/medibook-web/current;
    index index.html;

    # Compression for the bundles, the SVGs and JSON.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Source maps go to the error monitor, never to browsers (docs/MONITORING.md).
    location ~ \.map$ {
        return 404;
    }

    # Content-hashed bundles: the name changes with the content, so cache for a
    # year. A missing file must 404 (not fall back to index.html), so an open tab
    # on an old build reloads itself (RUN-01).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/medibook-security-headers.conf;
    }

    # Public files without a hash in their name: a day, so a redeploy shows up.
    location /brand/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include snippets/medibook-security-headers.conf;
    }

    # WOFF2 is compressed already, and nginx's mime.types knows its type.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include snippets/medibook-security-headers.conf;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        include snippets/medibook-security-headers.conf;
    }

    # The API on the same origin (DEP-02). The backend trusts X-Forwarded-For
    # only from TRUSTED_PROXY_CIDRS; list this host there (DEP-12).
    location /api/ {
        proxy_pass http://medibook_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live updates (DEP-11). The server closes idle sockets after 5 minutes and
    # the app pings every 30 seconds, so a 6-minute read timeout never fires first.
    location /ws/ {
        proxy_pass http://medibook_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }

    # Every other path is a screen of the single-page app: serve index.html,
    # revalidated on every load so a new release is picked up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/medibook-security-headers.conf;
    }
}
