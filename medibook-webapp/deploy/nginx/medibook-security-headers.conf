# Security headers for every response of the web app (docs/SECURITY_HEADERS.md).
# Included from each location of medibook-web.conf: nginx drops the
# server-level add_header lines in any location that sets its own.
#
# The Content-Security-Policy must match the <meta> policy in the built
# index.html, plus frame-ancestors (headers only). With the same-origin layout,
# 'self' already covers the API and WebSockets; replace files.example.com with
# the file-storage origin (VITE_STORAGE_ORIGIN).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://files.example.com; font-src 'self'; connect-src 'self' https://files.example.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
